[project]
name = "chronotagger"
version = "0.2.0"
description = "Interactive interval labeling for time-series with Tkinter/Matplotlib."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["pandas", "numpy", "matplotlib", "pyarrow"]  # pyarrow for parquet

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov",
]

[project.scripts]
chronotagger = "chronotagger.launcher:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]