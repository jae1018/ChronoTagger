name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Tk + virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-tk xvfb

      - name: Install package + test deps
        run: pip install -e ".[test]"

      - name: Run tests
        run: xvfb-run -a pytest tests/ --cov=chronotagger --cov-report=term-missing --tb=short
